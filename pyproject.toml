[project]
name = "hdv"
dynamic = ["version"]
description = "Hierarchical Data Viewer - interactive CSV drill-down for the terminal"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3.3",
    "textual>=7.5.0",
]
readme = "README.md"

[project.scripts]
hdv = "hdv.__main__:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+dev"

[tool.hatch.build.targets.wheel]
packages = ["hdv"]

[tool.hatch.build.targets.sdist]
force-include = { "share/man/man1/hdv.1" = "share/man/man1/hdv.1" }
